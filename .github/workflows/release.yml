name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Swift
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: '6.0'

    - name: Build and Test
      run: |
        swift build -c release
        swift test

    - name: Archive release build
      run: |
        zip -r ChineseAstrologyCalendar.zip .build/release

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: ChineseAstrologyCalendar.zip
        draft: false
        prerelease: false
