name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    # Astral depends on CoreLocation, which is only available on Apple
    # platforms, so the package can only be built on a macOS runner.
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # The Swift toolchain ships with the preinstalled Xcode on macOS runners.

    - name: Build and Test
      run: |
        swift build -c release
        swift test

    - name: Archive release build
      run: |
        zip -r ChineseAstrologyCalendar.zip .build/release

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: ChineseAstrologyCalendar.zip
        draft: false
        prerelease: false
